<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoC Copilot: PhonePe</title>
<meta name="description" content="Turns Play Store reviews of PhonePe into ranked problems, verbatim customer quotes and evidence-backed roadmap recommendations.">
<meta property="og:type" content="website">
<meta property="og:title" content="VoC Copilot: app reviews into roadmap evidence">
<meta property="og:description" content="Live demo. Tested against hand-labelled reviews: 77% theme agreement on unseen data.">
<meta property="og:image" content="https://voc-copilot-dashboard.vercel.app/og-image.png">
<meta property="og:url" content="https://voc-copilot-dashboard.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0d0e11;--card:#17191e;--c2:#1f2229;--line:#292c35;--tx:#eceef2;--mu:#98a0b0;--ac:#b8f34b;--pk:#d03fe0;--red:#ff7b7b;--amb:#ffc15e;--r:18px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:224px;flex:none;padding:26px 16px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:19px;padding:0 12px}.brand b{color:var(--ac)}
.sub{color:var(--mu);font-size:12.5px;padding:2px 12px 24px}
nav a{display:block;padding:10px 16px;border-radius:99px;color:var(--mu);text-decoration:none;margin-bottom:4px}
nav a:hover{background:var(--ac);color:#10140a;font-weight:600}
main{flex:1;min-width:0;max-width:1520px;padding:30px 34px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:32px;letter-spacing:-.6px;line-height:1.15}
.lead{color:var(--mu);margin-top:6px;max-width:62ch}
.chip{background:var(--ac);color:#10140a;font-weight:600;border-radius:99px;padding:8px 18px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi small{display:block;color:var(--mu);font-size:13px}
.kpi b{display:block;font-size:34px;line-height:1.15;margin:3px 0}
.kpi:first-child{background:linear-gradient(135deg,#d03fe0,#6b2fd9);border:0}
.kpi:first-child small{color:#f3e2ff}
.kpi:nth-child(2) b{color:var(--ac)}
.grid{display:grid;grid-template-columns:minmax(320px,5fr) 7fr;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px}
h2{font-size:18px;margin-bottom:4px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
.hint{color:var(--mu);font-size:13.5px;margin-bottom:16px}
#reviews{position:sticky;top:20px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;margin-bottom:0}
#rlist{overflow:auto;flex:1;padding-right:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
input,select{background:var(--c2);border:1px solid var(--line);color:var(--tx);border-radius:99px;padding:9px 15px;font:inherit;font-size:14px;min-width:0}
input{flex:1 1 150px}
.rv{background:var(--c2);border:1px solid transparent;border-radius:14px;padding:13px 15px;margin-bottom:10px}
.rv.hl{border-color:var(--ac);box-shadow:0 0 0 3px #b8f34b33}
.rh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;margin-bottom:6px}
.stars{color:var(--amb);letter-spacing:1px}
.rv p{overflow-wrap:anywhere}
.sv{border-radius:99px;padding:1px 10px;background:#ffffff14;font-size:12px}
.s3{color:var(--red)}.s2{color:var(--amb)}.s1{color:var(--ac)}.ch{color:#f08cff;background:#d03fe022}
.note{margin-top:6px;font-size:12.5px;color:var(--amb)}
.dn{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
.donut{width:156px;height:156px;border-radius:50%;position:relative;flex:none}
.donut:after{content:"";position:absolute;inset:28px;background:var(--card);border-radius:50%}
.donut span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1;font-size:26px;font-weight:700;line-height:1.1}
.donut small{display:block;font-size:11.5px;font-weight:400;color:var(--mu)}
.lg{display:grid;gap:7px;font-size:13.5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.tr{display:grid;grid-template-columns:12px 1fr 120px 42px;gap:12px;align-items:center;width:100%;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;padding:9px 8px;border-radius:12px;cursor:pointer;text-align:left}
.tr:hover,.tr.on{background:#ffffff10}
.tr .dot{margin:0}
.bar{height:8px;background:#ffffff14;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.tv{text-align:right;font-weight:600}
.subs{margin:2px 0 10px 32px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:8px;font-size:13.5px}
.grp{margin:4px 0 14px;padding:12px 14px;border-radius:14px;background:#b8f34b14;color:var(--tx);font-size:13.5px}
.rec{background:var(--c2);border-radius:16px;padding:18px;margin-bottom:14px}
.rt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.rt h3{flex:1 1 100%;font-size:17px;line-height:1.3}
.bd{border:1px solid var(--line);border-radius:99px;padding:2px 11px;font-size:12px;color:var(--mu)}
.bd.k{border-color:var(--ac);color:var(--ac)}
.st{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--mu);margin-bottom:10px}.st b{color:var(--tx)}
.rec p{margin-bottom:6px}.rec ul{margin:2px 0 8px 20px}
summary{cursor:pointer;color:var(--ac);margin:8px 0;font-size:14px}
.q{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid var(--pk);color:var(--tx);font:inherit;font-size:13.5px;padding:7px 11px;margin-top:6px;cursor:pointer;overflow-wrap:anywhere}
.q:hover{background:#ffffff0f}
.chips span{display:inline-block;margin:0 6px 7px 0;background:#ffffff0f;border-radius:99px;padding:3px 13px;font-size:13px;color:var(--mu)}
ul.lim{margin-left:20px;color:var(--mu)}ul.lim li{margin-bottom:6px}
.err{padding:24px;color:var(--amb)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:1020px){body{flex-direction:column}aside{width:100%;height:auto;position:sticky;top:0;z-index:5;background:var(--bg);border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:12px}.brand{padding:0;white-space:nowrap;font-size:17px}.sub{display:none}nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}nav a{white-space:nowrap;margin:0;padding:8px 14px;font-size:14px}[id]{scroll-margin-top:72px}.grid{grid-template-columns:1fr}#reviews{position:static;max-height:none}#rlist{max-height:560px}main{padding:22px 16px 40px}h1{font-size:26px}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<aside>
  <div class="brand">VoC <b>Copilot</b></div>
  <div class="sub">PhonePe · Google Play reviews</div>
  <nav aria-label="Sections"><a href="#top">Overview</a><a href="#themes">Themes</a><a href="#recs">Recommendations</a><a href="#reviews">Reviews</a><a href="#limits">Limits</a></nav>
</aside>
<main id="app"><p class="mu">Loading dashboard data…</p></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LB={app_crash_or_wont_open:"App crashes or won't open",payment_failed_or_delayed:"Payment failed or delayed",account_blocked_or_kyc:"Account blocked or KYC",trust_or_fraud_concern:"Trust or fraud concern",customer_support:"Customer support",bank_linking_and_verification:"Bank linking and verification",cashback_and_rewards:"Cashback and rewards",ads_and_clutter:"Ads and clutter",fees_and_charges:"Fees and charges",unwanted_auto_debit:"Unwanted auto-debit",privacy_and_data_deletion:"Privacy and data deletion",feature_request:"Feature request",other:"Other"};
const nice=k=>LB[k]||String(k).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const pl=(n,w)=>n+" "+w+(n===1?"":"s");
const CR="app_crash_or_wont_open",PAL=["#b8f34b","#d03fe0","#5b8cff","#ffc15e","#2ed3b7","#ff7b7b","#7b8194"];
let D,filter=null,q="";

fetch("dashboard_data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;render()})
 .catch(()=>{$("#app").innerHTML='<p class="err">Could not load dashboard_data.json. Keep it in the same folder as index.html and open the page through a web server (for example run <b>python -m http.server</b> in this folder).</p>'});

const sev=s=>s?`<span class="sv s${s}">Severity ${s}</span>`:"";
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);

function revHTML(){
  const t=q.toLowerCase();
  const L=D.reviews.filter(r=>(!filter||r.theme===filter)&&(!t||r.text.toLowerCase().includes(t)||(r.subcluster||"").toLowerCase().includes(t)));
  $("#cnt").textContent=L.length+" of "+D.reviews.length+" problem reviews"+(filter?" · "+nice(filter):"");
  $("#rlist").innerHTML=L.map(r=>`<article class="rv" id="rv-${esc(r.id)}"><div class="rh"><span class="stars" title="Star rating (not used for tagging)">${stars(r.rating)}</span><span class="mu">${esc(r.date)}</span>${sev(r.severity)}${r.churn_signal?'<span class="sv ch">Churn signal</span>':""}</div><p>${esc(r.text)}</p><div class="mu sm">${esc(nice(r.theme))}${r.subcluster?" · "+esc(r.subcluster):""}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:""}</article>`).join("")||'<p class="mu">No reviews match. Clear the search or pick another theme.</p>';
}

function themesHTML(){
  const max=Math.max(...D.themes.map(t=>t.priority));
  return D.themes.map(t=>{const on=filter===t.theme;
    return `<button class="tr${on?" on":""}" data-th="${esc(t.theme)}" aria-pressed="${on}"><span class="dot" style="background:${t.color}"></span><span>${esc(nice(t.theme))} <span class="mu sm">· ${pl(t.n,"review")}</span></span><span class="bar"><i style="width:${t.priority/max*100}%;background:${t.color}"></i></span><span class="tv">${t.priority}</span></button>`
    +(on&&t.subclusters.length?`<div class="subs">${t.subclusters.map(s=>`<div><b>${esc(s.name)}</b> <span class="mu">· ${pl(s.n,"review")}</span><div class="mu sm">${esc(s.definition)}</div></div>`).join("")}</div>`:"");
  }).join("");
}

function recHTML(r){
  const e=r.evidence,h=r.hypotheses_to_test||[];
  return `<div class="rec"><div class="rt"><h3>${esc(r.title)}</h3><span class="bd k">${esc(nice(r.kind))}</span><span class="bd">${esc(r.evidence_volume)} evidence volume</span></div>
<div class="st"><span><b>${e.reviews}</b> reviews</span><span><b>${e.mean_severity}</b> mean severity</span><span><b>${Math.round(e.severity3_share*100)}%</b> severity 3</span><span><b>${e.churn_mentions}</b> churn</span><span><b>${e.priority}</b> priority</span></div>
<p><b>What users report.</b> ${esc(r.user_problem)}</p><p><b>Proposed action.</b> ${esc(r.proposed_action)}</p>
<details><summary>Rationale, unknowns and how to validate</summary><p><b>Rationale.</b> ${esc(r.rationale)}</p><p><b>What reviews cannot tell us.</b> ${esc(r.unknowns)}</p><p><b>Validate first.</b> ${esc(r.validation_step)}</p>${h.length?`<p><b>Questions to test</b></p><ul>${h.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</details>
${r.quotes.map(x=>`<button class="q" data-id="${esc(x.review_id)}" title="Show this review">“${esc(x.quote)}”</button>`).join("")}</div>`;
}

function render(){
  const m=D.meta,o=m.overview,s=m.sample;
  const tot=D.themes.reduce((a,t)=>a+t.n,0);let acc=0,seg=[];
  D.themes.forEach((t,i)=>{t.color=PAL[Math.min(i,6)];const a=acc/tot*100;acc+=t.n;seg.push(`${t.color} ${a}% ${acc/tot*100}%`)});
  const churn=D.reviews.filter(r=>r.churn_signal);
  const g1=D.recommendations.filter(r=>(r.themes||[]).includes(CR)),g2=D.recommendations.filter(r=>!(r.themes||[]).includes(CR));
  const g1n=g1.reduce((a,r)=>a+r.evidence.reviews,0);
  const pct=n=>Math.round(n/o.total_reviews*100)+"% of all reviews";
  $("#app").innerHTML=`
<div class="top" id="top"><div><h1>Voice of Customer overview</h1><p class="lead">What PhonePe users complained about in the latest Google Play reviews. Every number is computed in code and every quote is verbatim.</p></div><span class="chip">Latest reviews</span></div>
<div class="kpis"><div class="kpi"><small>Reviews analysed</small><b>${o.total_reviews}</b><small>Latest sample</small></div>
<div class="kpi"><small>Describe a problem</small><b>${o.problem_reviews}</b><small>${pct(o.problem_reviews)}</small></div>
<div class="kpi"><small>Praise only</small><b>${o.praise}</b><small>${pct(o.praise)}</small></div>
<div class="kpi"><small>No usable signal</small><b>${o.no_signal}</b><small>${pct(o.no_signal)}</small></div>
<div class="kpi"><small>Churn signals</small><b>${churn.length}</b><small>Low confidence</small></div></div>
<div class="grid">
<section class="card" id="reviews" aria-label="Reviews"><h2>Reviews</h2><p class="hint">Problem reviews only. Stars are shown for context and were not used for tagging.</p>
<div class="filters"><input id="srch" type="search" placeholder="Search reviews" aria-label="Search reviews"><select id="sel" aria-label="Filter by theme"><option value="">All themes</option>${D.themes.map(t=>`<option value="${esc(t.theme)}">${esc(nice(t.theme))}</option>`).join("")}</select></div>
<div class="mu sm" id="cnt" style="margin-bottom:10px"></div><div id="rlist"></div></section>
<div>
<section class="card" id="themes"><h2>Themes by priority</h2><p class="hint">Priority = reviews × mean severity, plus 5 if any review in the group says the user is leaving. Select a theme to filter the reviews.</p>
<div class="dn"><div class="donut" style="background:conic-gradient(${seg.join(",")})"><span>${tot}<small>problem reviews</small></span></div>
<div class="lg">${D.themes.slice(0,6).map(t=>`<div><span class="dot" style="background:${t.color}"></span>${esc(nice(t.theme))} · ${t.n}</div>`).join("")}${D.themes.length>6?`<div class="mu"><span class="dot" style="background:${PAL[6]}"></span>${D.themes.length-6} smaller themes</div>`:""}</div></div>
<div id="thm">${themesHTML()}</div></section>
<section class="card" id="recs"><h2>Recommendations</h2><p class="hint">Evidence volume counts reviews. It does not measure how many users are affected.</p>
${g1.length?`<div class="grp"><b>App does not work.</b> These ${g1.length} recommendations describe one user problem and cover ${g1n} of ${o.problem_reviews} problem reviews. Read them together.</div>${g1.map(recHTML).join("")}`:""}
${g2.length?`<div class="grp"><b>Other problems</b></div>${g2.map(recHTML).join("")}`:""}</section>
<section class="card"><h2>Churn signals</h2><p class="hint">Reviews where the user says they are leaving or telling others to stay away.</p>${churn.map(r=>`<div class="rv"><p>${esc(r.text)}</p><div class="mu sm">Low confidence: ${churn.length} review in this sample</div></div>`).join("")||'<p class="mu">None found in this sample.</p>'}</section>
<section class="card"><h2>Not recommended</h2><p class="hint">Eligible groups without a recommendation, and groups too small to act on.</p><div class="chips">${(D.not_recommended||[]).map(x=>`<span title="${esc(x.reason||"")}">${esc(nice(x.name))} (${x.reviews})</span>`).join("")}${(D.weak_signals||[]).map(w=>`<span title="${esc(w.reason)}">${esc(nice(w.theme))} (${w.n})</span>`).join("")}</div></section>
<section class="card" id="limits"><h2>Limits</h2><ul class="lim">${D.limits.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></section>
</div></div>`;
  $("#srch").oninput=e=>{q=e.target.value;revHTML()};
  $("#sel").onchange=e=>setFilter(e.target.value||null);
  revHTML();
}

function setFilter(f){filter=f;$("#sel").value=f||"";$("#thm").innerHTML=themesHTML();revHTML()}

document.addEventListener("click",e=>{
  const th=e.target.closest("[data-th]");
  if(th){setFilter(filter===th.dataset.th?null:th.dataset.th);return}
  const qb=e.target.closest(".q");
  if(qb){
    if(filter||q){q="";$("#srch").value="";setFilter(null)}
    const el=document.getElementById("rv-"+qb.dataset.id);
    if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2400)}
  }
});
</script>
</body>
</html>
